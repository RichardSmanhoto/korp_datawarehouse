cubes:
  - name: FatoVendaPropostaItemTributo
    sql_table: "`viasoft_elt_{COMPILE_CONTEXT.securityContext.databaseName}`.`{COMPILE_CONTEXT.securityContext.schema}_impostositemproposta`"
    title: Venda Proposta Comercial - Tributos do Item

    meta:
      - versao: "__COMMIT_SHA__"

    joins:
      - name: FatoVendaPropostaItem
        relationship: belongsTo
        sql: "{CUBE}.itempropostaid = {FatoVendaPropostaItem}.id"

    measures:
      - name: count
        type: count

      - name: icmsValorSum
        sql: icms_valor
        type: sum
        title: Soma do ICMS

      - name: icmsStValorSum
        sql: icmsst_valorst
        type: sum
        title: Soma do ICMS-ST

      - name: ipiValorSum
        sql: ipi_valor
        type: sum
        title: Soma do IPI

      - name: pisValorSum
        sql: pis_valor
        type: sum
        title: Soma do PIS

      - name: cofinsValorSum
        sql: cofins_valor
        type: sum
        title: Soma do COFINS

      - name: fcpValorSum
        sql: fcp_valor
        type: sum
        title: Soma do FCP

    dimensions:
      - name: id
        sql: id
        type: string
        primary_key: true

      - name: idItemProposta
        sql: itempropostaid
        type: string
        title: Item da Proposta

      - name: icmsAliquotaCheia
        sql: icms_aliquotacheia
        type: number
        title: ICMS Alíquota Cheia

      - name: icmsAliquotaReducao
        sql: icms_aliquotareducao
        type: number
        title: ICMS Alíquota Redução

      - name: icmsBase
        sql: icms_base
        type: number
        title: ICMS Base

      - name: icmsReducaoBase
        sql: icms_reducaobase
        type: number
        title: ICMS Redução Base

      - name: icmsValor
        sql: icms_valor
        type: number
        title: ICMS Valor

      - name: icmsDiferimento
        sql: icms_diferimento
        type: number
        title: ICMS Diferimento

      - name: icmsTotalDiferido
        sql: icms_totaldiferido
        type: number
        title: ICMS Total Diferido

      - name: icmsTotalSemDiferimento
        sql: icms_totalsemdiferimento
        type: number
        title: ICMS Total Sem Diferimento

      - name: icmsStMva
        sql: icmsst_mva
