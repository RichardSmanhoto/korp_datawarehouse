cubes:
  - name: FatoVendaPropostaCabecalho
    sql_table: "`viasoft_elt_{COMPILE_CONTEXT.securityContext.databaseName}`.`{COMPILE_CONTEXT.securityContext.schema}_proposta`"
    title: Venda Proposta Comercial - Cabeçalho

    meta:
      - versao: "__COMMIT_SHA__"

    joins:
      - name: VendaCliente
        relationship: belongsTo
        sql: "{CUBE}.cliente_id = {VendaCliente}.GuidId"

      - name: CompraFornecedor
        relationship: belongsTo
        sql: "{CUBE}.representanteid = {CompraFornecedor}.GuidId"

      - name: CompraFornecedorTransportadora
        relationship: belongsTo
        sql: "{CUBE}.transportadoraid = {CompraFornecedorTransportadora}.GuidId"

      - name: CompraFornecedorRedespacho
        relationship: belongsTo
        sql: "{CUBE}.transportadoraredespachoid = {CompraFornecedorRedespacho}.GuidId"

      - name: PreCadastrosUsuarioSistema
        relationship: belongsTo
        sql: "{CUBE}.aprovadorid = {PreCadastrosUsuarioSistema}.Id"

    measures:
      - name: count
        type: count

      - name: valorFreteSum
        sql: valorfrete
        type: sum
        title: Soma do Frete

      - name: adiantamentoSum
        sql: adiantamento
        type: sum
        title: Soma do Adiantamento

      - name: valorProdutosSum
        sql: valorestotais_produtos
        type: sum
        title: Soma dos Produtos

      - name: valorTotalPropostaSum
        sql: valorestotais_valortotalproposta
        type: sum
        title: Soma do Valor Total da Proposta

      - name: valorDescontoSum
        sql: valorestotais_desconto
        type: sum
        title: Soma do Desconto

      - name: valorAcrescimoSum
        sql: valorestotais_acrescimo
        type: sum
        title: Soma do Acréscimo

      - name: lucroLiquidoSum
        sql: lucroliquido
        type: sum
        title: Soma do Lucro Líquido

    dimensions:
      - name: id
        sql: id
        type: string
        primary_key: true

      - name: idCliente
        sql: cliente_id
        type: string
        title: Cliente

      - name: idTransportadora
        sql: transportadoraid
        type: string
        title: Transportadora

      - name: idTransportadoraRedespacho
