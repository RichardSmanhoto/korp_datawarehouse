      - name: status
        sql: status
        type: number
        title: Status

      - name: statusDescricao
        sql: |
          CASE
            WHEN {CUBE}.status = 0 THEN 'Aberto'
            WHEN {CUBE}.status = 1 THEN 'Aguardando Liberação'
            WHEN {CUBE}.status = 2 THEN 'Reprovado'
            WHEN {CUBE}.status = 3 THEN 'Aprovado'
            WHEN {CUBE}.status = 4 THEN 'Fechado'
            WHEN {CUBE}.status = 5 THEN 'Programar Entrega'
            WHEN {CUBE}.status = 6 THEN 'Inativo'
            WHEN {CUBE}.status = 7 THEN 'Aguardando Sincronização'
            ELSE 'Não Mapeado'
          END
        type: string
        title: Status Descrição

      - name: motivoStatus
        sql: motivostatus
        type: number
        title: Motivo Status

      - name: motivoStatusDescricao
        sql: |
          CASE
            WHEN {CUBE}.motivostatus IS NULL THEN 'Sem Motivo'
            WHEN {CUBE}.motivostatus = 0 THEN 'Inadimplente'
            WHEN {CUBE}.motivostatus = 1 THEN 'Crédito Insuficiente'
            WHEN {CUBE}.motivostatus = 2 THEN 'Saldo Insuficiente'
            WHEN {CUBE}.motivostatus = 3 THEN 'Aguardando Aprovação'
            WHEN {CUBE}.motivostatus = 4 THEN 'Aguardando Geração Pedido'
            WHEN {CUBE}.motivostatus = 5 THEN 'Aguardando Liberação ERP'
            WHEN {CUBE}.motivostatus = 6 THEN 'Aprovado'
            WHEN {CUBE}.motivostatus = 7 THEN 'Aguardando Liberação Financeira'
            WHEN {CUBE}.motivostatus = 8 THEN 'Gateway Timeout ao Gerar Pedido'
            WHEN {CUBE}.motivostatus = 9 THEN 'Aguardando Aprovação Desconto'
            ELSE 'Não Mapeado'
          END
        type: string
        title: Motivo Status Descrição

      - name: origem
        sql: origem
        type: number
        title: Origem

      - name: origemDescricao
        sql: |
          CASE
            WHEN {CUBE}.origem = 0 THEN 'Proposta Comercial'
            WHEN {CUBE}.origem = 1 THEN 'Orçamento Vendas'
            WHEN {CUBE}.origem = 2 THEN 'Oportunidade'
            WHEN {CUBE}.origem = 3 THEN 'Mobile'
            WHEN {CUBE}.origem = 4 THEN 'Importação'
            WHEN {CUBE}.origem = 5 THEN 'Intercompany'
            WHEN {CUBE}.origem = 6 THEN 'Análise Compras'
            ELSE 'Não Mapeado'
          END
        type: string
        title: Origem Descrição

