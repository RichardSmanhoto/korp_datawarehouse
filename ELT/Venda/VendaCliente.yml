        vc.Id AS id,
        vc.Codigo AS codigo,
        vc.RazaoSocial AS razaoSocial,
        vc.CodigoSegmento AS codigoSegmento,
        vc.DescricaoSegmento AS descricaoSegmento,
        vc.CodigoClasse AS codigoClasse,
        vc.DescricaoClasse AS descricaoClasse,
        vc.CodigoPais AS codigoPais,
        vc.DescricaoPais AS descricaoPais,
        vc.CodigoEstado AS codigoEstado,
        vc.DescricaoEstado AS descricaoEstado,
        vc.CodigoCidade AS codigoCidade,
        vc.DescricaoCidade AS descricaoCidade,
        vc.CGC AS CGC,
        cc.R_E_C_N_O_ AS idCadastroCliente,
        cc.AGENCIA AS agenciaBancaria,
        cc.ASN_COD_LOCAL_DESTINO AS asnCodLocalDestino,
        cc.AVISO_EMBARQUE AS avisoEmbarque,
        cc.BAIRRO AS bairro,
        cc.BAIRROPGTO AS bairroPagamento,
        cc.BANCO AS banco,
        cc.BARRAR_FATURA AS barrarFaturamento,
        cc.CELULA AS celula,
        cc.CEP AS cep,
        cc.CEPPGTO AS cepPagamento,
        cc.CFO AS cfo,
        cc.CGC_TRAN AS cnpjTransportadora,
        cc.CIDADE AS cidade,
        cc.CIDADEFRETE AS cidadeFrete,
        cc.CIDADEPGTO AS cidadepgto,
        cc.CLI_DESDE AS cliDesde,
        cc.CLIEN AS clien,
        cc.COMPLEMENTO AS complemento,
        cc.COND_PGTO AS condPgto,
        cc.CONTA AS conta,
        cc.CONTATO AS contato,
        cc.CREDITO_CLIENTE AS creditoCliente,
        cc.CT_IR_RT AS ctIrRt,
