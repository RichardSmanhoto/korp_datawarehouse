        cc.CUSTOFIN AS custofin,
        cc.DATA AS data,
        cc.DESTACAR_ISS AS destacarIss,
        cc.DIAS_INAD AS diasInad,
        cc.DOCA AS doca,
        cc.DOLAR AS dolar,
        cc.EDI_CODIGO AS ediCodigo,
        cc.EDI_UC_PRE AS ediUcPre,
        cc.EDI_UC_SUF AS ediUcSuf,
        cc.EDI_UM_PRE AS ediUmPre,
