cubes:
  - name: FatoVendaPropostaItem
    sql_table: "`viasoft_elt_{COMPILE_CONTEXT.securityContext.databaseName}`.`{COMPILE_CONTEXT.securityContext.schema}_itemproposta`"
    title: Venda Proposta Comercial - Item

    meta:
      - versao: "__COMMIT_SHA__"

    joins:
      - name: FatoVendaPropostaCabecalho
        relationship: belongsTo
        sql: "{CUBE}.propostaid = {FatoVendaPropostaCabecalho}.id"

      - name: LogisticaProduto
        relationship: belongsTo
        sql: "{CUBE}.produto_id = {LogisticaProduto}.GuidId"

      - name: PreCadastrosUsuarioSistema
        relationship: belongsTo
        sql: "{CUBE}.idaprovadordesconto = {PreCadastrosUsuarioSistema}.Id"

      - name: PreCadastrosEmpresa
        relationship: belongsTo
        sql: "{CUBE}.idempresa = {PreCadastrosEmpresa}.GuidId"

    measures:
      - name: count
        type: count

      - name: quantidadeSum
        sql: quantidade
        type: sum
        title: Soma da Quantidade

      - name: valorUnitarioSum
        sql: valorunitario
        type: sum
        title: Soma do Valor Unitário

      - name: valorTotalProdutosSum
        sql: valortotalprodutos
        type: sum
        title: Soma do Valor Total Produtos

      - name: valorTotalVendaSum
        sql: valortotalvenda
        type: sum
        title: Soma do Valor Total Venda

      - name: totalDescontoSum
        sql: totaldesconto
        type: sum
        title: Soma do Desconto

      - name: totalImpostosSum
        sql: totalimpostos
        type: sum
        title: Soma dos Impostos

      - name: valorFreteSum
        sql: valorfrete
        type: sum
        title: Soma do Frete

    dimensions:
      - name: id
        sql: id
        type: string
        primary_key: true

      - name: idProposta
        sql: propostaid
        type: string
        title: Proposta

      - name: idProduto
        sql: produto_id
        type: string
        title: Produto

      - name: idAprovadorDesconto
        sql: idaprovadordesconto
        type: string
        title: Aprovador de Desconto

      - name: idEmpresa
        sql: idempresa
        type: string
        title: Empresa

      - name: produtoCodigo
        sql: produto_codigo
        type: string
        title: Código do Produto

      - name: unidadePadrao
        sql: unidadepadrao
        type: string
        title: Unidade Padrão

      - name: ordem
        sql: ordem
        type: string
        title: Ordem

      - name: revisaoProduto
        sql: revisaoproduto
        type: string
        title: Revisão Produto

      - name: numeroItem
        sql: numeroitem
        type: number
        title: Número do Item

      - name: motivoNaoAprovar
        sql: motivonaoaprovar
        type: string
        title: Motivo Não Aprovar

      - name: numeroRevisaoEngenharia
        sql: numerorevisaoengenharia
        type: string
        title: Revisão Engenharia

      - name: tipo
        sql: tipo
        type: number
        title: Tipo

      - name: tipoDescricao
        sql: |
          CASE
            WHEN {CUBE}.tipo = 0 THEN 'Normal'
            WHEN {CUBE}.tipo = 1 THEN 'Kit'
            WHEN {CUBE}.tipo = 2 THEN 'Componente'
            ELSE 'Não Mapeado'
          END
        type: string
        title: Tipo Descrição

      - name: numero
        sql: numero
        type: number
        title: Número

      - name: descricaoProduto
        sql: descricaoproduto
        type: string
        title: Descrição Produto

      - name: codigoCliente
        sql: codigocliente
        type: string
        title: Código do Cliente

      - name: categoriaItem
        sql: categoriaitem
        type: number
        title: Categoria do Item

      - name: categoriaItemDescricao
        sql: |
          CASE
            WHEN {CUBE}.categoriaitem = 10 THEN 'Matéria Prima'
            WHEN {CUBE}.categoriaitem = 25 THEN 'Itens Prod. Importação Direta'
            WHEN {CUBE}.categoriaitem = 30 THEN 'Serviço'
            WHEN {CUBE}.categoriaitem = 40 THEN 'Terceiros'
            WHEN {CUBE}.categoriaitem = 45 THEN 'Itens Improdutivos'
            WHEN {CUBE}.categoriaitem = 50 THEN 'Itens Consignados'
            WHEN {CUBE}.categoriaitem = 77 THEN 'Itens Produtivos Kanban'
            WHEN {CUBE}.categoriaitem = 80 THEN 'Ferramentas'
            WHEN {CUBE}.categoriaitem = 99 THEN 'Produto Acabado'
            WHEN {CUBE}.categoriaitem = 100 THEN 'Kit de Venda'
            WHEN {CUBE}.categoriaitem = 110 THEN 'Itens de Embalagem'
            WHEN {CUBE}.categoriaitem = 200 THEN 'Revenda'
            WHEN {CUBE}.categoriaitem = 300 THEN 'Kit'
            ELSE 'Não Mapeado'
          END
        type: string
        title: Categoria do Item Descrição

      - name: complemento
        sql: complemento
        type: string
        title: Complemento

      - name: dataEntrega
        sql: dataentrega
        type: time
        title: Data de Entrega

      - name: leadTime
        sql: leadtime
        type: number
        title: Lead Time

      - name: prazoValidade
        sql: prazovalidade
        type: number
        title: Prazo de Validade

      - name: produtoVolume
        sql: produto_volume
        type: number
        title: Volume do Produto

      - name: produtoMetragemCubica
        sql: produto_metragemcubica
